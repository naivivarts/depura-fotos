      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar la app
        working-directory: DepuraFotos
        run: gradle assembleRelease --no-daemon

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp DepuraFotos/app/build/outputs/apk/release/app-release.apk DepuraFotos.apk
          gh release create "v1.0-build${{ github.run_number }}" DepuraFotos.apk \
            --repo "${{ github.repository }}" \
            --title "Depura Fotos (build ${{ github.run_number }})" \
            --notes "APK listo para instalar en Android."
